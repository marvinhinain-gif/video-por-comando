<style>
/* Layout: coluna única centralizada (capa → perguntas → oferta); carrossel coverflow de reels como assinatura; mobile-first */
:root{
  --bg:#000;
  --card:#111113;
  --card-2:#17171A;
  --card-3:#202024;
  --line:rgba(255,255,255,.10);
  --line-2:rgba(255,255,255,.18);
  --text:#ECE9E2;
  --muted:#AAA59B;
  --dim:#716c64;
  --gold:#D6A329;
  --gold-hi:#F2D488;
  --gold-grad:linear-gradient(100deg,#F4DB8F 0%,#D6A329 52%,#B8871A 100%);
  --gold-soft:rgba(214,163,41,.13);
  --red:#FF4A3D;
  --cta-grad:linear-gradient(100deg,#6EEBA0 0%,#22C55E 50%,#16A34A 100%);
  --cta-ink:#042713;
  --cta-glow:34,197,94;
  --f:"Poppins",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text)}
html{overflow-x:clip}
body{font-family:var(--f);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;text-align:center}
img,video{max-width:100%;display:block}
button,a{font-family:inherit;touch-action:manipulation}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
h1:focus,h2:focus{outline:none}
.gold{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.col{width:100%;max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{display:block;font:600 11.5px/1.2 var(--f);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.glow{position:fixed;inset:-25% -20% auto;height:75vh;pointer-events:none;z-index:0;background:radial-gradient(45% 55% at 50% 25%,rgba(214,163,41,.17),transparent 70%)}
main,header,.progress{position:relative;z-index:1}

/* Botões */
.cta{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border:0;border-radius:16px;padding:16px 20px;background:var(--cta-grad);color:var(--cta-ink);font:700 16px/1.2 var(--f);letter-spacing:.02em;text-transform:uppercase;text-decoration:none;cursor:pointer;
  box-shadow:0 0 0 1px rgba(255,255,255,.14) inset,0 14px 36px -12px rgba(var(--cta-glow),.8);transition:transform .2s var(--ease),opacity .2s}
.cta{animation:breathe 2.8s ease-in-out infinite}
.cta:active{animation:none;transform:scale(.98)}
@keyframes breathe{0%,100%{transform:scale(1);box-shadow:0 0 0 1px rgba(255,255,255,.14) inset,0 12px 30px -14px rgba(var(--cta-glow),.6)}50%{transform:scale(1.025);box-shadow:0 0 0 1px rgba(255,255,255,.18) inset,0 16px 42px -10px rgba(var(--cta-glow),.95)}}
.cta .arr{transition:transform .2s var(--ease)}
.cta:hover .arr{transform:translateX(4px)}
.cta.pulse::after{content:"";position:absolute;inset:-3px;border-radius:19px;border:1.5px solid rgba(var(--cta-glow),.35);animation:ring 2.8s ease-out infinite;pointer-events:none}
@keyframes ring{0%{opacity:.7;transform:scale(1)}80%,100%{opacity:0;transform:scale(1.05)}}
.cta[aria-disabled="true"]{opacity:.45;animation:none}
.cta[aria-disabled="true"]::after{display:none}
.unlock{margin:2px 0 0;font-size:13px;line-height:1.4;color:var(--muted);text-wrap:balance}
.seals{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;font-size:13px;color:var(--muted)}
.seals span{display:inline-flex;align-items:center;gap:6px}
.seals span::before{content:"✓";color:var(--gold);font-weight:700;font-size:12px}

/* ===== CAPA ===== */
.cover{display:flex;flex-direction:column;align-items:center;gap:clamp(14px,2.6svh,22px);padding-block:14px 28px}
.cover .logo{height:26px;width:auto}
.cover h1{margin:0;font-size:clamp(30px,8.6vw,52px);line-height:1.06;letter-spacing:-.035em;font-weight:700;text-wrap:balance;max-width:16ch}
.cover .cta-box{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px}
.cover .sub{margin:-6px 0 0;font-size:clamp(14px,3.8vw,16px);line-height:1.45;color:var(--muted);max-width:34ch;text-wrap:balance}
.cover .sub b{color:var(--text)}

/* Carrossel coverflow */
.flow{position:relative;width:100vw;max-width:900px;height:clamp(240px,42vh,420px);height:clamp(240px,42svh,420px);overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
.fcard{position:absolute;left:50%;top:0;height:100%;aspect-ratio:9/16;border-radius:20px;overflow:hidden;background:#0b0b0c;border:1px solid var(--line);
  transition:transform .7s var(--ease),opacity .7s var(--ease),filter .7s var(--ease);will-change:transform}
.fcard video,.fcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fcard.on{border-color:rgba(214,163,41,.7);box-shadow:0 20px 50px -20px rgba(214,163,41,.55)}
.fcard .cap{position:absolute;left:8px;right:8px;bottom:8px;z-index:2;font:600 11px/1.2 var(--f);padding:6px 8px;border-radius:8px;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .4s}
.fcard.on .cap{opacity:1}
.dots{display:flex;gap:6px;justify-content:center;margin-top:-4px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--card-3);transition:all .4s var(--ease)}
.dots i.on{width:18px;background:var(--gold)}

/* ===== PROGRESSO ===== */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#000}
.progress{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(0,0,0,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-block:10px 9px;border-bottom:1px solid var(--line)}
.pbar{display:grid;grid-template-columns:72px 1fr 72px;align-items:center}
.pbar img{height:24px;width:auto;justify-self:center}
.back{justify-self:start;background:none;border:0;color:var(--muted);font:500 13px var(--f);padding:8px 4px;cursor:pointer}
.back:hover{color:var(--text)}
.pcount{justify-self:end;font:500 12px var(--mono);color:var(--muted)}
.pcount b{color:var(--gold-hi);font-weight:500}
.track{display:flex;gap:4px;margin-top:8px}
.clip{flex:1;height:6px;border-radius:3px;background:var(--card-3);overflow:hidden;position:relative}
.clip.on{background:var(--gold-grad)}
.clip.now::after{content:"";position:absolute;inset:0;width:40%;background:var(--gold-grad);opacity:.8;animation:fill 1.4s ease-in-out infinite alternate}
@keyframes fill{to{width:100%}}

/* ===== PERGUNTAS ===== */
.q{display:flex;flex-direction:column;align-items:center;gap:18px;padding-block:24px 44px;animation:rise .45s var(--ease) both}
@keyframes rise{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}
.q h2{margin:0;font-size:clamp(23px,6.3vw,32px);line-height:1.16;letter-spacing:-.025em;font-weight:700;text-wrap:balance;max-width:20ch}
.insight{margin:-4px 0 0;display:inline-flex;align-items:center;gap:8px;max-width:38ch;font-size:14px;line-height:1.4;color:var(--muted);text-wrap:balance}
.opts{width:100%;max-width:440px;display:flex;flex-direction:column;gap:10px}
.opt{position:relative;width:100%;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 40px;color:var(--text);font:600 15.5px/1.3 var(--f);cursor:pointer;transition:border-color .2s,background .2s,transform .15s}
.opt small{display:block;font:400 12.5px/1.35 var(--f);color:var(--muted);margin-top:2px}
.opt:hover{border-color:rgba(214,163,41,.55);background:var(--card-2)}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--gold);background:linear-gradient(100deg,rgba(214,163,41,.16),rgba(214,163,41,.05))}
.opt.sel::after{content:"✓";position:absolute;right:14px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--gold-grad);color:#1a1406;display:grid;place-items:center;font-size:12px;font-weight:800}

/* Pergunta com vídeos */
.vgrid{width:100%;max-width:330px;max-width:clamp(240px,calc((100svh - 250px) * .5625 + 10px),330px);display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vopt{position:relative;aspect-ratio:9/16;border-radius:16px;overflow:hidden;border:1.5px solid var(--line);background:#0b0b0c;padding:0;cursor:pointer;color:var(--text);transition:border-color .2s,transform .2s var(--ease)}
.vopt video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vopt .lb{position:absolute;left:0;right:0;bottom:0;padding:34px 8px 10px;background:linear-gradient(transparent,rgba(0,0,0,.9) 55%);font:700 13.5px/1.2 var(--f);z-index:2}
.vopt .lb small{display:block;font:400 11px/1.3 var(--f);color:#cfcac0;margin-top:2px}
.vopt:hover{border-color:rgba(214,163,41,.6)}
.vopt:active{transform:scale(.98)}
.vopt.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.vopt .chk{position:absolute;top:8px;right:8px;z-index:2;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);border:1px solid var(--line-2);display:grid;place-items:center;font-size:12px;color:transparent;font-weight:800}
.vopt.sel .chk{background:var(--gold-grad);color:#1a1406;border-color:transparent}

/* Pausa */
.clock{display:flex;flex-direction:column;align-items:center;gap:2px}
.clock strong{font-size:clamp(64px,19vw,92px);line-height:1;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.clock span{color:var(--muted);font-size:14px}
.cuts{width:100%;max-width:270px;max-width:clamp(190px,calc(22svh * 1.125 + 10px),270px);display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cuts figure{margin:0;display:flex;flex-direction:column;gap:6px}
.cuts .sound{font-size:10px;padding:6px 9px;bottom:6px}
.cuts .scr{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:9/16;background:#0b0b0c;border:1px solid var(--line)}
.cuts figure:last-child .scr{border-color:rgba(214,163,41,.55)}
.cuts video{width:100%;height:100%;object-fit:cover}
.cuts figcaption{font-size:12px;color:var(--muted)}
.chip{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:2;white-space:nowrap;font:600 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 7px;border-radius:6px;background:rgba(0,0,0,.7)}
.chip.raw{color:#ffb4ad}.chip.ok{color:var(--gold-hi)}
.ask{max-width:380px;font-size:14px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.ask small{display:block;font-size:11px;color:var(--gold);letter-spacing:.12em;text-transform:uppercase;font-weight:600;margin-bottom:2px}

/* Nome */
.namebox{width:100%;max-width:420px;display:flex;flex-direction:column;gap:8px}
.namebox input{width:100%;text-align:center;background:var(--card);border:1.5px solid var(--line-2);border-radius:16px;padding:17px;color:var(--text);font:600 18px var(--f)}
.namebox input::placeholder{color:var(--dim);font-weight:500}
.namebox input:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 4px var(--gold-soft)}
.namebox input[aria-invalid="true"]{border-color:var(--red)}
.err{min-height:20px;font-size:13px;color:#ff8a80;margin:0}
.lock{font-size:12.5px;color:var(--dim);margin:0}

/* Carregando */
.loading{display:flex;flex-direction:column;align-items:center;gap:24px;padding-block:56px;animation:rise .4s var(--ease) both}
.ring{width:108px;height:108px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:var(--card-3)}
.ring .fgc{stroke:url(#gg);stroke-linecap:round;stroke-dasharray:302;stroke-dashoffset:302;animation:load 3s var(--ease) forwards}
@keyframes load{to{stroke-dashoffset:0}}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:500 21px var(--mono)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;text-align:left}
.checks li{display:flex;gap:10px;align-items:center;color:var(--dim);font-size:15px;transition:color .3s}
.checks li i{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-style:normal;font-size:11px;color:transparent;transition:all .3s}
.checks li.done{color:var(--text)}
.checks li.done i{background:var(--gold-grad);color:#1a1406;border-color:transparent}

/* ===== VENDAS ===== */
.sales{display:flex;flex-direction:column;align-items:center;gap:22px;padding-block:24px 120px;animation:rise .5s var(--ease) both}
.sales h2.hero{margin:0;font-size:clamp(28px,7.8vw,44px);line-height:1.08;letter-spacing:-.035em;font-weight:800;text-wrap:balance}
.stat{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.stat .num{font-size:clamp(60px,18vw,84px);line-height:.95;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.stat .num small{font-size:.32em;letter-spacing:-.01em;font-weight:600;color:var(--muted);margin-left:4px}
.bars{display:flex;flex-direction:column;gap:9px;text-align:left}
.bars .row{display:grid;grid-template-columns:64px 1fr 66px;gap:10px;align-items:center;font-size:12.5px}
.bars em{font-style:normal;color:var(--muted)}
.bars code{font:500 12px var(--mono);text-align:right}
.bar{height:12px;border-radius:5px;background:var(--card-3);overflow:hidden}
.bar b{display:block;height:100%;width:0;background:repeating-linear-gradient(135deg,#ff5a4d 0 6px,#d63a2f 6px 12px);transition:width 1.1s var(--ease)}
.bar.g b{background:var(--gold-grad)}
.tiny{font-size:11.5px;color:var(--dim);margin:0}
.badge{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1.2 var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--gold-hi);padding:8px 14px;border:1px solid rgba(214,163,41,.45);border-radius:999px;background:var(--gold-soft)}
.punch{margin:0;font-size:clamp(19px,5.2vw,24px);line-height:1.3;font-weight:600;letter-spacing:-.015em;max-width:24ch;text-wrap:balance}
.muted{margin:0;color:var(--muted);font-size:15px;max-width:36ch;text-wrap:balance}
.duo{width:100%;max-width:400px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.phone{position:relative;border-radius:22px;padding:5px;background:linear-gradient(160deg,#2a2a2f,#121214);box-shadow:0 0 0 1px var(--line)}
.phone.after{box-shadow:0 24px 60px -26px rgba(214,163,41,.6),0 0 0 1px rgba(214,163,41,.45)}
.phone .scr{position:relative;border-radius:17px;overflow:hidden;aspect-ratio:9/16;background:#0b0b0c}
.phone video{width:100%;height:100%;object-fit:cover}
.sound{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);z-index:2;border:0;border-radius:999px;background:rgba(0,0,0,.7);color:var(--text);font:600 11px var(--f);padding:7px 11px;cursor:pointer;white-space:nowrap}
.sound[aria-pressed="true"]{background:var(--gold-grad);color:#1a1406}
.steps3{width:100%;max-width:440px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.steps3 div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;font-weight:600;font-size:13.5px}
.steps3 small{display:block;font:500 11px var(--mono);color:var(--gold);margin-bottom:3px}
.offer{width:100%;max-width:440px;border:1px solid rgba(214,163,41,.5);border-radius:26px;padding:24px 18px 20px;background:radial-gradient(120% 55% at 50% 0%,rgba(214,163,41,.18),var(--card) 62%);display:flex;flex-direction:column;align-items:center;gap:16px}
.offer .logo{height:28px;width:auto}
.offer h3{margin:0;font-size:clamp(22px,6vw,28px);line-height:1.15;letter-spacing:-.03em;font-weight:800;text-wrap:balance}
.offer ul{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:8px}
.offer li{display:flex;gap:10px;align-items:center;justify-content:center;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:600;font-size:14.5px}
.offer li i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--gold-grad);color:#1a1406;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800}
.price{display:flex;flex-direction:column;gap:2px}
.price span{color:var(--muted);font-size:13.5px}
.price strong{font-size:50px;line-height:1.02;font-weight:800;letter-spacing:-.045em}
.perhour{font-size:13px;color:var(--gold-hi);background:var(--gold-soft);border-radius:10px;padding:8px 12px;margin:0}
.guar{display:flex;gap:12px;align-items:center;text-align:left;padding-top:14px;border-top:1px solid var(--line);width:100%}
.seal{flex:none;width:52px;height:52px;border-radius:50%;border:1.5px dashed var(--gold);display:grid;place-items:center;text-align:center;line-height:1;color:var(--gold-hi)}
.seal b{display:block;font-size:19px;font-weight:800}
.seal small{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase}
.guar p{margin:0;font-size:12.5px;color:var(--muted)}
.faq{width:100%;max-width:440px;text-align:left}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 16px}
details+details{margin-top:8px}
summary{list-style:none;cursor:pointer;padding:15px 0;font-weight:600;font-size:14.5px;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--gold);font-size:18px;line-height:1}
details[open] summary::after{content:"–"}
details p{margin:0 0 15px;color:var(--muted);font-size:14px}
.final{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;align-items:center;padding-top:8px}
.redo{background:none;border:0;color:var(--dim);font:500 13px var(--f);text-decoration:underline;cursor:pointer;padding:8px}

/* Lead */
.flabel{font:600 11.5px/1.2 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.namebox .cta{margin-top:4px}

/* Como funciona em 3 passos */
.how{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 16px 18px;border-radius:26px;border:1px solid var(--line);background:linear-gradient(180deg,var(--card-2),var(--card))}

function makeFlow(el,items){
  el.innerHTML=items.map((it,i)=>`<div class="fcard" data-k="${i}"><img src="${it.p}" alt="" loading="${i<3?"eager":"lazy"}"><video muted loop playsinline preload="none" poster="${it.p}"></video><span class="cap">${it.t}</span></div>`).join("");

  el.after(dots);
  const cards=[...el.children],n=cards.length;let cur=0,timer=null,visible=true;
  function layout(){
    const w=el.clientWidth,ch=cards[0].offsetWidth||1;
    const gap=Math.min(ch*.68,w*.27);
    cards.forEach((c,i)=>{
      let o=i-cur;if(o>n/2)o-=n;if(o<-n/2)o+=n;

      c.style.filter=a?"brightness(.5)":"none";
      c.style.zIndex=10-a;
      c.classList.toggle("on",a===0);
      const v=c.querySelector("video");
      if(a===0&&visible){if(!v.src)v.src=items[i].v;v.preload="auto";tryPlay(v)}
      else{if(a===1&&!v.src){v.src=items[i].v;v.preload="metadata"}v.pause()}
    });

  const start=()=>{stop();if(!reduced)timer=setInterval(()=>go(1),2800)};
  const stop=()=>{clearInterval(timer);timer=null};

  el.addEventListener("pointerup",e=>{if(x0===null)return;const dx=e.clientX-x0;x0=null;if(Math.abs(dx)>35){go(dx<0?1:-1);start()}else{const k=e.target.closest(".fcard");if(k){const i=+k.dataset.k;let o=i-cur;if(o>n/2)o-=n;if(o<-n/2)o+=n;if(o){go(o);start()}}}});

    ?`<div class="vgrid">${q.opts.map((o,i)=>`<button type="button" class="vopt${chosen===i?" sel":""}" data-i="${i}" id="${q.id}-${i}" aria-label="${o.t}: ${o.s}"><video data-src="${o.vid}" poster="${o.p}" muted loop playsinline preload="none"></video><span class="lb">${o.t}<small>${o.s}</small></span><span class="chk">✓</span></button>`).join("")}</div>`
    :`<div class="opts">${q.opts.map((o,i)=>`<button type="button" class="opt${chosen===i?" sel":""}" data-i="${i}" id="${q.id}-${i}">${o.t}${o.s?`<small>${o.s}</small>`:""}</button>`).join("")}</div>`;
  app.innerHTML=`<section class="col"><div class="q">
    <h2 id="qt">${q.title}</h2>${q.insight?`<p class="insight">${q.insight}</p>`:""}
    <div role="group" aria-labelledby="qt" style="width:100%;display:flex;justify-content:center">${body}</div></div></section>`;
  if(q.type==="video")autoplayVisible(app);
  app.querySelectorAll("[data-i]").forEach(b=>b.addEventListener("click",()=>{
    answers[q.id]=+b.dataset.i;
    app.querySelectorAll("[data-i]").forEach(x=>x.classList.toggle("sel",x===b));
    if(navigator.vibrate)try{navigator.vibrate(8)}catch(e){}
    setTimeout(()=>go(step+1),280);
  }));
}

function hours(){const t=val("tempo"),f=val("freq");return{semana:t.v*f.v,mes:t.v*f.v*4.3}}
function fmtH(h){if(h<1)return Math.round(h*60)+"min";const r=Math.round(h*2)/2;return(r%1?r.toFixed(1).replace(".",","):r)+"h"}
function countUp(el,to,fmt){
  if(reduced){el.textContent=fmt(to);return}
  const t0=performance.now(),d=1100;
  (function f(t){const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=fmt(to*e);if(p<1)requestAnimationFrame(f);else el.textContent=fmt(to)})(t0);
}

function fmtPhone(v){
  const d=v.replace(/\D/g,"").slice(0,11);
  if(d.length<=2)return d.length?"("+d:"";
  if(d.length<=6)return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if(d.length<=10)return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
}
function sendLead(){
  if(!LEAD_WEBHOOK)return;
  const r={};QUESTIONS.forEach(q=>{if(!q.pause&&answers[q.id]!=null)r[q.id]=val(q.id).t});
  const {mes}=hours();
  const body=JSON.stringify({nome,whatsapp:whats,horas_mes:Math.round(mes),respostas:r,pagina:location.href,data:new Date().toISOString()});
  try{fetch(LEAD_WEBHOOK,{method:"POST",mode:"no-cors",keepalive:true,headers:{"Content-Type":"text/plain;charset=utf-8"},body})}catch(e){}
}

let vturbLoaded=false;
function mountVsl(box){
  if(VSL.vturb){
    box.innerHTML=`<vturb-smartplayer id="vid-${VSL.vturbId}" style="display:block;margin:0 auto;width:100%;max-width:400px"><div class="vturb-player-placeholder" style="position:relative;width:100%;padding:177.77777777777777% 0 0;z-index:0;background-color:black"></div></vturb-smartplayer>`;
    if(!vturbLoaded){vturbLoaded=true;const sc=document.createElement("script");sc.src=VSL.vturbJs;sc.async=true;document.head.appendChild(sc)}
  }else{
    box.innerHTML=`<video src="${VSL.src}" poster="${VSL.poster}" controls playsinline preload="none"></video>`;
  }
}

function go(n){
  cleanups.forEach(f=>{try{f&&f()}catch(e){}});cleanups=[];
  document.querySelectorAll(".dots").forEach(d=>d.remove());
  step=n;updateChrome();
  if(step<0){app.innerHTML=coverHTML;setupCover()}
  else if(step<QUESTIONS.length){QUESTIONS[step].pause?renderPause():renderQuestion()}
  else if(step===NAME_STEP)renderName();
  else if(step===LOAD_STEP)renderLoading();
  else renderResult();
  window.scrollTo(0,0);
  const h=app.querySelector("#qt");
  if(h&&step!==NAME_STEP){h.setAttribute("tabindex","-1");h.focus({preventScroll:true})}
}
document.addEventListener("keydown",e=>{
  if(step<0||step>=QUESTIONS.length||QUESTIONS[step].pause||e.target.tagName==="INPUT"||e.key.length!==1)return;
  const k=e.key.toUpperCase().charCodeAt(0)-65,b=app.querySelector(`[data-i="${k}"]`);if(b)b.click();
});
setupCover();
</script>
