<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quiz Biblioteca de Skills · Descubra suas skills</title>
<meta name="description" content="Quiz grátis de 60 segundos: diga com o que você trabalha e descubra quais skills fazem sua IA atender, postar e organizar por você.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta property="og:type" content="website">
<meta property="og:title" content="250 skills pra sua IA trabalhar por você">
<meta property="og:description" content="Responda um quiz de 60 segundos e descubra quais skills resolvem o seu trabalho.">
<meta property="og:image" content="https://quiz-biblioteca.onrender.com/m/og.jpg">
<meta property="og:url" content="https://quiz-biblioteca.onrender.com/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Arial,Helvetica,sans-serif' font-weight='800' font-size='36' fill='%23D6A329'%3EA.%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* =========================================================
   TOKENS — preto + dourado (mesmos da página de vendas)
   ========================================================= */
:root{
  --bg:#000;
  --card:#111113;
  --card-2:#17171A;
  --card-3:#202024;
  --line:rgba(255,255,255,.10);
  --line-2:rgba(255,255,255,.17);
  --text:#ECE9E2;
  --muted:#A9A498;
  --dim:#6E6A62;
  --gold:#D6A329;
  --gold-hi:#F2D488;
  --gold-soft:rgba(214,163,41,.12);
  --gold-grad:linear-gradient(100deg,#F4DB8F 0%,#D6A329 52%,#B8871A 100%);
  --gold-tile:linear-gradient(140deg,#F6DE97 0%,#DDAA35 45%,#A97A12 100%);
  --btn-ink:#1A1406;
  --cta-grad:linear-gradient(100deg,#6EEBA0 0%,#22C55E 50%,#16A34A 100%);
  --cta-ink:#042713;
  --cta-glow:34,197,94;
  --wpp:#25D366;
  --red:#FF2B2B;
  --err:#FF6B6B;
  --ok:#4FD18B;
  --f:"Poppins",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text)}
html{overflow-x:clip;-webkit-text-size-adjust:100%}
body{font-family:var(--f);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:clip;text-align:center}
img,video{max-width:100%;display:block}
button,a,input{font-family:inherit;touch-action:manipulation}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
h1:focus,h2:focus{outline:none}
.gold{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.col{width:100%;max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:600 11px/1.2 var(--f);letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(60% 45% at 50% 0%,rgba(214,163,41,.15),transparent 70%)}
main,.progress,.topbar{position:relative;z-index:1}
.si{display:inline-block;width:1em;height:1em;flex:none;background:currentColor;-webkit-mask:var(--u) center/contain no-repeat;mask:var(--u) center/contain no-repeat}

/* ---------- Faixa Black Friday ---------- */
.topbar{display:flex;justify-content:center;align-items:center;gap:10px;padding:8px 14px;background:var(--gold-grad);color:var(--btn-ink);font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1.3}
.topbar svg{width:16px;height:16px;flex:none}
.topbar.tb-free{gap:8px;font-size:13px;letter-spacing:.08em}
.topbar.tb-free span{background:none;padding:0;font-size:16px;color:inherit}
.topbar span{background:var(--btn-ink);color:var(--gold-hi);padding:3px 10px;border-radius:99px;font-size:11.5px;white-space:nowrap}

/* ---------- Headline (igual à página) ---------- */
.h1{margin:0;width:100%;font-size:30px;line-height:1.12;font-weight:700;letter-spacing:-.025em;color:#fff;text-transform:uppercase}
.h1 .ln{display:table;margin:0 auto;white-space:nowrap}
.h1 .ul{background:linear-gradient(var(--red),var(--red)) 0 100%/100% .12em no-repeat;padding-bottom:.1em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.h1 .ball{display:inline-block;width:.2em;height:.2em;margin-left:.06em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF1BF,#E2B03C 45%,#8A6716 100%);box-shadow:0 0 .3em rgba(214,163,41,.6)}

/* ---------- Botões (verde pulsando) ---------- */
.cta{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border:0;border-radius:16px;padding:14px 20px;background:var(--cta-grad);color:var(--cta-ink);font:700 16.5px/1.2 var(--f);text-decoration:none;cursor:pointer;
  box-shadow:0 0 0 1px rgba(255,255,255,.14) inset,0 14px 36px -12px rgba(var(--cta-glow),.8);animation:breathe 2.8s ease-in-out infinite}
.cta:active{animation:none;transform:scale(.98)}
.cta::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:shine 2.8s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
@keyframes breathe{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.025);filter:brightness(1.08)}}
.cta .arr{transition:transform .2s var(--ease)}
.cta:hover .arr{transform:translateX(4px)}
.unlock{margin:0;font-size:13px;line-height:1.4;color:var(--muted);text-wrap:balance}
.trust{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.trust span{display:inline-flex;align-items:center;gap:7px}
.trust .wa{color:var(--wpp);font-weight:600}
.trust .wa .si{font-size:17px}

/* ---------- CAPA ---------- */
.cover{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,1.9svh,18px);padding-block:clamp(14px,2.4svh,26px) 22px}
.cover .sub{margin:0;font-size:15px;line-height:1.4;color:var(--muted);max-width:34ch;text-wrap:balance}
.cover .cta-box{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px}

/* Carrossel coverflow */
.fwrap{align-self:stretch;margin-inline:-16px;display:flex;flex-direction:column;gap:8px}
.flow{position:relative;width:100%;height:clamp(200px,44svh,420px);overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.fcard{position:absolute;left:50%;top:0;height:100%;aspect-ratio:9/16;border-radius:20px;overflow:hidden;background:#0b0b0c;border:1px solid var(--line);
  transition:transform .7s var(--ease),opacity .7s var(--ease),filter .7s var(--ease);will-change:transform;cursor:pointer}
.fcard video,.fcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.fcard.on{border:2px solid var(--gold);box-shadow:0 20px 50px -20px rgba(214,163,41,.55);cursor:default}
.fcard .cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:34px 10px 10px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.85));font:600 12px/1.25 var(--f);color:#fff;opacity:0;transition:opacity .4s;text-align:center}
.fcard .cap small{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--btn-ink);background:var(--gold-grad);padding:2px 7px;border-radius:99px;margin-bottom:4px}
.fcard.on .cap{opacity:1}
.snd{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:3;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font:600 11.5px var(--f);padding:8px 12px;min-height:34px;cursor:pointer;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .3s}
.fcard.on .snd{opacity:1;pointer-events:auto}
.snd[aria-pressed="true"]{background:var(--gold-grad);color:var(--btn-ink);border-color:transparent}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--card-3);transition:all .4s var(--ease)}
.dots i.on{width:18px;background:var(--gold)}
/* imagens com movimento */
.fx-pan{background:#0c0b09}
.fx-pan img{inset:auto;left:50%;top:0;height:100%;width:auto;max-width:none;object-fit:initial;translate:-50% 0;transform-origin:50% 0}
.fx-zoom img{object-position:55% 30%;transform-origin:50% 35%}
.fx-side{background:#f3f5f9}
.fx-side img{object-position:0% 50%}
.fcard.on.fx-pan img{animation:menuPan 9s ease-in-out forwards}
.fcard.on.fx-zoom img{animation:kb 9s ease-out forwards}
.fcard.on.fx-side img{animation:side 9s ease-in-out forwards}
.pmedia.fx-pan img{animation:menuPan 9s ease-in-out infinite alternate}
.pmedia.fx-zoom img{animation:kb 9s ease-in-out infinite alternate}
@keyframes menuPan{0%,14%{transform:none}42%{transform:scale(1.5)}100%{transform:scale(1.5) translateY(-33%)}}
@keyframes kb{to{transform:scale(1.14)}}
@keyframes side{0%,10%{object-position:0% 50%}100%{object-position:100% 50%}}

/* ---------- PROGRESSO (uma barra dourada) ---------- */
.progress{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;border-bottom:1px solid var(--line)}
.mark{display:block;font:800 17px/1 var(--f);letter-spacing:-.02em}
.track{margin-top:9px;height:6px;border-radius:3px;background:var(--card-3);overflow:hidden}
.track b{display:block;height:100%;width:0;border-radius:3px;background:var(--gold-grad);transition:width .6s var(--ease)}

/* ---------- PERGUNTAS ---------- */
.q{display:flex;flex-direction:column;align-items:center;gap:16px;padding-block:22px 44px;animation:rise .45s var(--ease) both}
@keyframes rise{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}
.q h2{margin:0;font-size:clamp(22px,6.2vw,30px);line-height:1.18;letter-spacing:-.025em;font-weight:700;text-wrap:balance;max-width:22ch}
.qsub{margin:-8px 0 0;font-size:14.5px;line-height:1.45;color:var(--muted);max-width:36ch;text-wrap:balance}
.insight{margin:2px 0 0;max-width:38ch;font-size:13.5px;line-height:1.45;color:var(--muted);text-wrap:balance;padding-top:12px;border-top:1px solid var(--line)}
.insight::before{content:"✦ ";color:var(--gold)}
.opts{width:100%;max-width:440px;display:flex;flex-direction:column;gap:10px}
.opt{position:relative;width:100%;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 42px;color:var(--text);font:600 15.5px/1.3 var(--f);cursor:pointer;transition:border-color .2s,background .2s,transform .15s}
.opt:hover{border-color:rgba(214,163,41,.55);background:var(--card-2)}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--gold);background:linear-gradient(100deg,rgba(214,163,41,.16),rgba(214,163,41,.05))}
.opt.sel::after{content:"✓";position:absolute;right:14px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--gold-grad);color:var(--btn-ink);display:grid;place-items:center;font-size:12px;font-weight:800}
/* P1: grade de nichos */
.ngrid{width:100%;max-width:440px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ngrid .opt{min-height:62px;padding:10px 12px;gap:9px;font-size:13.5px;line-height:1.25;flex-direction:row;justify-content:flex-start;text-align:left}
.ngrid .opt .em{font-size:24px;line-height:1;flex:none}
.ngrid .opt:last-child{grid-column:1/-1;justify-content:center;min-height:52px}
.ngrid .opt.sel::after{top:6px;right:6px;transform:none;width:18px;height:18px;font-size:11px}

/* Pausa */
.clock{display:flex;flex-direction:column;align-items:center;gap:0}
.clock strong{font-size:clamp(64px,19vw,92px);line-height:1;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.clock span{color:var(--text);font-size:16px;font-weight:600}
.clock2{margin:-8px 0 0;color:var(--muted);font-size:15px}
.clock2 b{color:var(--gold-hi)}
.tiny{font-size:11.5px;color:var(--dim);margin:-6px 0 0}
.pmedia{position:relative;width:min(56vw,240px);aspect-ratio:9/16;border-radius:20px;overflow:hidden;background:#0b0b0c;border:2px solid var(--gold);box-shadow:0 24px 50px -24px rgba(214,163,41,.5)}
.pmedia video,.pmedia img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pmedia.fx-pan img{inset:auto;left:50%;top:0;width:auto;max-width:none;object-fit:initial}
.sound{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:2;border:0;border-radius:999px;background:rgba(0,0,0,.72);color:var(--text);font:600 12px var(--f);padding:9px 13px;min-height:36px;cursor:pointer;white-space:nowrap}
.sound[aria-pressed="true"]{background:var(--gold-grad);color:var(--btn-ink)}
.ask{width:100%;max-width:400px;margin:0;font-size:15px;font-weight:500;color:#fff;background:var(--card);border:1px solid var(--line-2);border-radius:16px;padding:12px 14px;text-align:left}
.ask small{display:block;font-size:11px;color:var(--gold);letter-spacing:.14em;font-weight:600;margin-bottom:3px}

/* Captura */
.lead{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;text-align:left}
.lead label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.lead input{width:100%;min-height:54px;border-radius:14px;border:1px solid var(--line-2);background:var(--card);color:#fff;font:500 16px var(--f);padding:12px 14px;outline:none;transition:border-color .2s}
.lead input:focus{border-color:var(--gold)}
.lead input[aria-invalid="true"]{border-color:var(--err)}
.err{min-height:0;margin:0;color:var(--err);font-size:13.5px;font-weight:500}
.safe{margin:0;text-align:center;font-size:12.5px;color:var(--muted)}

/* Carregando */
.loading{display:flex;flex-direction:column;align-items:center;gap:24px;padding-block:56px;animation:rise .4s var(--ease) both}
.loading h2{margin:0;font-size:21px;line-height:1.3;letter-spacing:-.02em;max-width:24ch;text-wrap:balance}
.ring{width:108px;height:108px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:var(--card-3)}
.ring .fgc{stroke:url(#gg);stroke-linecap:round;stroke-dasharray:302;stroke-dashoffset:302;animation:load 3s var(--ease) forwards}
@keyframes load{to{stroke-dashoffset:0}}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:500 21px var(--mono)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;text-align:left}
.checks li{display:flex;gap:10px;align-items:center;color:var(--dim);font-size:15px;transition:color .3s}
.checks li i{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-style:normal;font-size:11px;color:transparent;transition:all .3s}
.checks li.done{color:var(--text)}
.checks li.done i{background:var(--gold-grad);color:var(--btn-ink);border-color:transparent}

/* ---------- RESULTADO / VENDAS ---------- */
.sales{display:flex;flex-direction:column;align-items:center;gap:20px;padding-block:22px 56px;animation:rise .5s var(--ease) both}
.hero2{margin:0;font-size:clamp(26px,7.4vw,40px);line-height:1.12;letter-spacing:-.03em;font-weight:800;text-wrap:balance;max-width:18ch}
.vsl{position:relative;width:100%;max-width:340px;max-width:min(340px,calc((100svh - 190px) * .5625));min-width:220px;aspect-ratio:9/16;border-radius:20px;overflow:hidden;background:#000;box-shadow:0 0 0 1.5px rgba(214,163,41,.6),0 30px 70px -30px rgba(214,163,41,.5);cursor:pointer}
.vsl video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.vsl .sound{bottom:18px;font-size:13px;padding:10px 15px}
.vprog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.14);z-index:2}
.vprog b{display:block;height:100%;width:0;background:var(--gold-grad)}
.after{width:100%;display:flex;flex-direction:column;align-items:center;gap:22px}
.after.show{animation:rise .7s var(--ease) both}
.blk{width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;gap:12px}
.blk h3{margin:0;font-size:clamp(22px,6.2vw,28px);line-height:1.18;letter-spacing:-.025em;font-weight:700;text-wrap:balance;color:#fff}
.badge{display:inline-flex;align-items:center;gap:8px;font:600 12px/1.2 var(--f);letter-spacing:.06em;color:var(--gold-hi);padding:8px 14px;border:1px solid rgba(214,163,41,.45);border-radius:999px;background:var(--gold-soft)}
.prof{width:100%;max-width:460px;background:var(--card);border:1px solid var(--line-2);border-radius:22px;padding:20px 18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.prof small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
.punch{margin:0;font-size:clamp(19px,5.2vw,23px);line-height:1.3;font-weight:700;letter-spacing:-.015em;color:#fff;text-wrap:balance}
.muted{margin:0;color:var(--muted);font-size:15px;max-width:36ch;text-wrap:balance}
/* comparativo lado a lado (igual à página) */
.cmp2{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}
.cmp2 .cc{display:flex;flex-direction:column;border-radius:18px;padding:14px 10px 10px;min-width:0}
.cmp2 .cc.no{border:1px solid rgba(255,90,90,.35);background:linear-gradient(180deg,#2a1214,#140d0e)}
.cmp2 .cc.yes{border:1px solid rgba(79,209,139,.45);background:linear-gradient(180deg,#0f2a1c,#0b1510);box-shadow:0 30px 70px -30px rgba(79,209,139,.45)}
.cc-h{padding-bottom:10px;margin-bottom:4px;border-bottom:1px solid rgba(255,255,255,.08)}
.cc-h b{display:block;font-size:14px;font-weight:700;line-height:1.2}
.no .cc-h b{color:#ff7b7b}.yes .cc-h b{color:var(--ok)}
.cc-h span{display:block;margin-top:4px;font-family:var(--mono);font-size:10px;color:var(--dim)}
.cc ul{list-style:none;margin:0 0 10px;padding:0;display:grid}
.cc li{display:flex;align-items:flex-start;gap:7px;padding:6px 0;font-size:12px;line-height:1.3;overflow-wrap:anywhere}
.no li{color:#c9b9b9}.yes li{color:#fff}
.cc li i{flex:none;width:18px;height:18px;margin-top:-1px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:9.5px;font-weight:800}
.no li i{background:rgba(255,90,90,.16);color:#ff6b6b}
.yes li i{background:#22c55e;color:#06210f}
.cc-f{margin-top:auto;padding:9px 6px;border-radius:10px;text-align:center;font-weight:700;font-size:11.5px;line-height:1.25}
.no .cc-f{background:rgba(255,90,90,.12);color:#ff7b7b}
.yes .cc-f{background:rgba(79,209,139,.12);color:var(--ok)}
@media (min-width:420px){.cmp2{gap:12px}.cmp2 .cc{padding:18px 14px 12px}.cc-h b{font-size:16px}.cc li{font-size:13.5px;gap:10px}.cc li i{width:22px;height:22px;font-size:11px}.cc-f{font-size:13px}}
/* a conta */
.calc{width:100%;max-width:460px;border-radius:22px;padding:20px 18px;background:#fbf8f1;color:#1d1b17;text-align:left;box-shadow:0 30px 60px -30px rgba(214,163,41,.5)}
.calc .tag{display:inline-block;font:700 10.5px/1 var(--f);letter-spacing:.14em;text-transform:uppercase;color:#8a8273;margin-bottom:10px}
.calc p{margin:0;font-size:16px;line-height:1.5}
.calc b{color:#c2410c}

.cr b{display:block;color:#fff;font-size:15px}
.cr small{display:block;color:var(--gold-hi);font-size:12px;margin-top:1px}
.cr p{margin:6px 0 0;font-size:13.5px;line-height:1.45;color:var(--muted)}

.offer{width:100%;max-width:460px;border-radius:26px;padding:2px;background:conic-gradient(from var(--ang,0deg),rgba(214,163,41,.25) 0deg,rgba(214,163,41,.25) 200deg,#F2D488 280deg,#fff 300deg,#D6A329 320deg,rgba(214,163,41,.25) 360deg);animation:orbit 6s linear infinite;box-shadow:0 40px 110px -40px rgba(214,163,41,.55)}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes orbit{to{--ang:360deg}}
.offer-in{border-radius:24px;background:#0b0b0c;padding:24px 18px;text-align:left}
.cta.jump{max-width:460px}
#oferta{scroll-margin-top:16px}
.offer-in h3{margin:0;font-size:20px;color:#fff;text-align:center}
.inc{list-style:none;display:grid;gap:12px;margin:18px 0;padding:0}
.inc li{display:flex;gap:12px;font-size:14px}
.inc li i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--gold-soft);border:1px solid rgba(214,163,41,.5);color:var(--gold-hi);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;margin-top:1px}

.inc small{color:var(--muted);font-size:12.5px}

.bonus{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:13.5px;margin-bottom:8px}
.bonus>span:first-child{display:flex;align-items:center;gap:10px}
.bonus .bi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--card-2);border:1px solid var(--line-2);color:var(--gold-hi);flex:none}
.bonus .bi svg{width:14px;height:14px}
.bonus .bi .si{font-size:15px;color:var(--wpp)}
.bonus .pr{text-align:right;font-size:12px;line-height:1.25;color:var(--ok);font-weight:600;white-space:nowrap}
.bonus .pr s{display:block;color:var(--muted);font-weight:400}
.price{text-align:center;margin:22px 0 18px}
.price .off{display:inline-block;padding:4px 12px;border-radius:99px;background:var(--gold-grad);color:var(--btn-ink);font-size:11.5px;font-weight:700;letter-spacing:.06em}
.price .from{display:block;color:var(--muted);font-size:14px;margin-top:10px}
.price .val{display:flex;justify-content:center;align-items:flex-start;gap:4px;color:#fff;line-height:1;margin-top:6px}
.price .val small{font-size:20px;font-weight:600;margin-top:8px}
.price .val b{font-size:66px;font-weight:800;letter-spacing:-.03em}
.price .once{display:block;font-size:11px;letter-spacing:.16em;font-weight:600;color:var(--gold);margin-top:8px}
.offer .trust{margin-top:14px}

.seal{flex:none;width:96px;height:96px;filter:drop-shadow(0 10px 24px rgba(214,163,41,.35))}
.seal .seal-ring{transform-origin:60px 60px;animation:sealSpin 22s linear infinite}
@keyframes sealSpin{to{transform:rotate(360deg)}}
.guar strong{display:block;color:#fff;font-size:15px}
.guar p{margin:4px 0 0;font-size:13px;color:var(--muted)}

.faq details{border-radius:14px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 16px;font-size:14.5px;font-weight:500;color:#fff}
.faq summary::-webkit-details-marker{display:none}

.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{margin:0;padding:0 16px 16px;font-size:13.5px;color:var(--muted)}
.final{width:100%;max-width:460px;display:flex;flex-direction:column;gap:14px;align-items:center;padding-top:6px}
.res-flow .flow{height:clamp(260px,54svh,460px)}
footer{width:100%;padding:24px 16px 30px;font-size:12px;color:var(--dim);border-top:1px solid var(--line)}

/* Carrossel coverflow: só o card central toca; src carregado sob demanda */
function makeFlow(el, dotsEl, keys){
  el.innerHTML = keys.map((k,i)=>{
    const m = MEDIA[k], capt = `<span class="cap"><small>${m.c}</small><br>${m.t}</span>`;
    return m.img
      ? `<div class="fcard fx-${m.fx}" data-k="${i}"><img src="${mediaPoster(k)}" alt="${esc(m.t)}" loading="lazy" draggable="false">${capt}</div>`
      : `<div class="fcard" data-k="${i}"><video muted loop playsinline preload="none" poster="${mediaPoster(k)}" data-src="m/${k}.mp4"></video>${m.som?`<button type="button" class="snd" aria-pressed="false">🔇 Ouvir</button>`:""}${capt}</div>`;
  }).join("");
  dotsEl.innerHTML = keys.map(()=>"<i></i>").join("");
  const cards = [...el.children], n = cards.length; let cur = 0, timer = null, visible = false, soundOn = false;
  function layout(){
    const w = el.clientWidth, ch = cards[0].offsetWidth || 1;
    const gap = Math.min(ch*.72, w*.28);
    soundOn = false;
    cards.forEach((c,i)=>{
      let o = i-cur; if (o > n/2) o -= n; if (o < -n/2) o += n;
      const a = Math.abs(o);
      c.style.transform = `translateX(calc(-50% + ${o*gap}px)) scale(${a ? 1-Math.min(a,2)*.15 : 1})`;
      c.style.opacity = a > 2 ? 0 : a === 2 ? .45 : 1;
      c.style.filter = a ? "brightness(.5)" : "none";
      c.style.zIndex = 10-a;
      c.classList.toggle("on", a === 0);
      const v = c.querySelector("video"); if (!v) return;
      const b = c.querySelector(".snd");
      if (a !== 0 && !v.muted){ v.muted = true; if (b){ b.setAttribute("aria-pressed","false"); b.textContent = "🔇 Ouvir"; } }
      if (a === 0 && visible && !document.hidden){ if (!v.src) v.src = v.dataset.src; v.preload = "auto"; tryPlay(v); if (!v.muted) soundOn = true; }
      else { if (a === 1 && !v.src){ v.src = v.dataset.src; v.preload = "metadata"; } v.pause(); }
    });
    [...dotsEl.children].forEach((d,i)=>d.classList.toggle("on", i===cur));
  }
  const go = d => { cur = (cur+d+n)%n; layout(); };
  const stop = () => { clearInterval(timer); timer = null; };
  const start = () => { stop(); if (!reduced && !soundOn && visible) timer = setInterval(()=>go(1), 3200); };
  let x0 = null;
  const onDown = e => { x0 = e.clientX; };
  const onUp = e => {
    if (x0 === null || e.target.closest(".snd")) { x0 = null; return; }
    const dx = e.clientX - x0; x0 = null;
    if (Math.abs(dx) > 35){ go(dx < 0 ? 1 : -1); start(); return; }
    const k = e.target.closest(".fcard"); if (!k) return;
    let o = +k.dataset.k - cur; if (o > n/2) o -= n; if (o < -n/2) o += n;
    if (o){ go(o); start(); }
  };
  const onSnd = e => {
    const b = e.target.closest(".snd"); if (!b) return;
    const c = b.closest(".fcard"); if (!c.classList.contains("on")) return;
    const v = c.querySelector("video"), on = v.muted;
    if (!v.src) v.src = v.dataset.src;
    v.muted = !on; if (on){ v.currentTime = 0; tryPlay(v); }
    b.setAttribute("aria-pressed", String(on)); b.textContent = on ? "🔊 Som ligado" : "🔇 Ouvir";
    soundOn = on; on ? stop() : start();
  };
  el.addEventListener("pointerdown", onDown); el.addEventListener("pointerup", onUp); el.addEventListener("click", onSnd);
  const io = "IntersectionObserver" in window ? new IntersectionObserver(es=>{ visible = es[0].isIntersecting; layout(); visible ? start() : stop(); }, {threshold:.2}) : null;
  if (io) io.observe(el); else visible = true;
  const onVis = () => { layout(); document.hidden ? stop() : start(); };
  document.addEventListener("visibilitychange", onVis);
  let lastW = innerWidth; const onR = () => { if (innerWidth !== lastW){ lastW = innerWidth; layout(); } };
  addEventListener("resize", onR);
  el._layout = layout;
  layout(); start();
  return () => { stop(); io && io.disconnect(); removeEventListener("resize", onR); document.removeEventListener("visibilitychange", onVis); el.querySelectorAll("video").forEach(v=>v.pause()); };
}

/* vídeos soltos (pausa): toca quando aparece, pausa fora da tela */
function autoplayVisible(root){
  const vids = root.querySelectorAll("video[data-src]");
  if (!("IntersectionObserver" in window)){ vids.forEach(v=>{ v.src = v.dataset.src; tryPlay(v); }); return; }
  const seen = new Set();
  const sync = v => { if (seen.has(v) && !document.hidden){ if (!v.src) v.src = v.dataset.src; tryPlay(v); } else v.pause(); };
  const io = new IntersectionObserver(es=>es.forEach(e=>{ e.isIntersecting ? seen.add(e.target) : seen.delete(e.target); sync(e.target); }), {threshold:.25});
  vids.forEach(v=>io.observe(v));
  const onVis = () => vids.forEach(sync);
  document.addEventListener("visibilitychange", onVis);
  cleanups.push(()=>{ io.disconnect(); document.removeEventListener("visibilitychange", onVis); vids.forEach(v=>v.pause()); });
}
function wireSound(root){
  root.querySelectorAll(".sound").forEach(b=>b.addEventListener("click", e=>{
    e.stopPropagation();
    const v = b.parentElement.querySelector("video"), on = b.getAttribute("aria-pressed") !== "true";
    if (!v.src && v.dataset.src) v.src = v.dataset.src;
    v.muted = !on; if (on){ v.currentTime = 0; tryPlay(v); }
    b.setAttribute("aria-pressed", String(on)); b.textContent = on ? "🔊 Som ligado" : "🔇 Ouvir";
  }));
}
function countUp(el, to, fmt){
  if (reduced){ el.textContent = fmt(to); return; }
  const t0 = performance.now(), d = 1100; let live = true;
  (function f(t){ if (!live) return; const p = Math.min(1,(t-t0)/d), e = 1-Math.pow(1-p,3); el.textContent = fmt(to*e); if (p < 1) requestAnimationFrame(f); else el.textContent = fmt(to); })(t0);
  const t = setTimeout(()=>{ if (live){ live = false; el.textContent = fmt(to); } }, d + 150);   // garante o número final mesmo sem animação
  cleanups.push(()=>{ live = false; clearTimeout(t); });
}

function maskTel(v){
  let d = v.replace(/\D/g,"");
  if (d.length > 11 && d.startsWith("55")) d = d.slice(2);   // tira o +55 de quem cola o número completo
  d = d.slice(0,11);
  if (!d) return "";
  if (d.length < 3) return "(" + d;
  const ddd = d.slice(0,2), r = d.slice(2);
  if (d.length <= 6) return `(${ddd}) ${r}`;
  if (d.length <= 10) return `(${ddd}) ${r.slice(0,4)}-${r.slice(4)}`;
  return `(${ddd}) ${r.slice(0,5)}-${r.slice(5)}`;
}
function validTel(v){ const d = v.replace(/\D/g,""); return (d.length === 10 || d.length === 11) && +d.slice(0,2) >= 11; }

let vturbLoaded = false;
function mountVsl(box){
  if (VSL.vturb){
    box.style.aspectRatio = "auto"; box.style.cursor = "default";

    if (!vturbLoaded){ vturbLoaded = true; const sc = document.createElement("script"); sc.src = VSL.vturbJs; sc.async = true; document.head.appendChild(sc); }
    return;
  }
  box.innerHTML = `<video data-src="${esc(VSL.src)}" poster="${esc(VSL.poster)}" muted loop playsinline preload="none"></video>
    <button class="sound" type="button" aria-pressed="false">🔇 Toque para ouvir</button><span class="vprog"><b></b></span>`;
  const v = box.querySelector("video"), b = box.querySelector(".sound"), bar = box.querySelector(".vprog b");
  const paint = () => { const on = !v.muted; b.setAttribute("aria-pressed", String(on)); b.textContent = on ? "🔊 Som ligado" : "🔇 Toque para ouvir"; };
  box.addEventListener("click", ()=>{
    if (!v.src) v.src = v.dataset.src;
    const on = v.muted; v.muted = !on; v.loop = !on;
    if (on) v.currentTime = 0;
    v.play().catch(()=>{ v.muted = true; v.loop = true; paint(); tryPlay(v); });
    paint();
  });
  v.addEventListener("ended", ()=>{ v.muted = true; v.loop = true; paint(); tryPlay(v); });
  v.addEventListener("timeupdate", ()=>{ if (v.duration) bar.style.width = (v.currentTime/v.duration*100) + "%"; });
  autoplayVisible(box);
}

/* ---------- rastreio do funil (tabela quiz_eventos): só etapa, tempo, nicho, origem e aparelho; nada de nome/telefone ---------- */
const ETAPAS_OK = ["capa","nicho","dor","gasto","horas","pausa","ia","tempo","carregando","resultado","oferta"];
const sessao = (()=>{
  const mk = () => {
    try { if (crypto.randomUUID) return crypto.randomUUID(); } catch(e) {}
    const b = new Uint8Array(16);
    try { crypto.getRandomValues(b); } catch(e) { for (let i = 0; i < 16; i++) b[i] = Math.random()*256 | 0; }
    b[6] = b[6] & 15 | 64; b[8] = b[8] & 63 | 128;
    const h = [...b].map(x=>x.toString(16).padStart(2,"0")).join("");
    return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
  };
  let s = "";
  try { s = sessionStorage.getItem("qb_sessao") || ""; } catch(e) {}
  if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s)){ s = mk(); try { sessionStorage.setItem("qb_sessao", s); } catch(e) {} }
  return s;   // recarregar na mesma aba = mesma visita
})();
const utmSource = (()=>{ try { return (new URLSearchParams(location.search).get("utm_source") || "").replace(/[\u0000-\u001f\u007f]/g, "").trim().slice(0,100); } catch(e) { return ""; } })();
/* de onde a pessoa veio: UTMs completas e, para quem chega sem UTM, os sinais para deduzir a origem
   (site anterior sem a query, app em que o link abriu e o tipo de clid). Nada pessoal. */
const ORIGEM = (()=>{
  const o = {};
  try {
    const q = new URLSearchParams(location.search), cl = v => (v || "").replace(/[\u0000-\u001f\u007f]/g, "").trim().slice(0,200);
    ["medium","campaign","content","term"].forEach(k => { const v = cl(q.get("utm_" + k)); if (v) o["utm_" + k] = v; });
    const clid = q.has("fbclid") ? "fb" : (q.has("gclid") || q.has("gbraid") || q.has("wbraid")) ? "google" : q.has("ttclid") ? "tiktok" : q.has("msclkid") ? "bing" : "";
    if (clid) o.clid = clid;
    let ref = "";
    try { if (document.referrer){ const u = new URL(document.referrer); if (u.host && u.host !== location.host) ref = (u.host + u.pathname).toLowerCase().slice(0,200); } } catch(e) {}
    o.ref = ref;   // "" = chegou sem site anterior (link mandado por mensagem, copiado ou digitado)
    const ua = navigator.userAgent || "";
    const app = /Instagram/i.test(ua) ? "instagram" : /FBAN|FBAV|FB_IAB|FBIOS|FB4A/.test(ua) ? "facebook"
      : /musical_ly|BytedanceWebview|TikTok|trill_/i.test(ua) ? "tiktok" : /LinkedInApp/i.test(ua) ? "linkedin"
      : /Twitter/i.test(ua) ? "x" : /Telegram/i.test(ua) ? "telegram" : /WhatsApp/i.test(ua) ? "whatsapp"
      : /Snapchat/i.test(ua) ? "snapchat" : /Pinterest/i.test(ua) ? "pinterest" : /\bGSA\//.test(ua) ? "google" : /\bLine\//.test(ua) ? "line" : "";
    if (app) o.app = app;
  } catch(e) {}
  return o;
})();
const dispositivo = () => { try { return innerWidth < 768 || matchMedia("(pointer: coarse)").matches ? "celular" : "computador"; } catch(e) { return "celular"; } };
let lastEtapa = null, lastEtapaT = 0;
function sendEvent(row){
  if (!SUPABASE.url) return;
  const body = Object.assign({quiz:"biblioteca", sessao, dispositivo:dispositivo()}, ORIGEM, row);
  if (utmSource) body.utm_source = utmSource;
  if (answers.nicho != null) body.nicho = nicheKey();
  try {
    fetch(`${SUPABASE.url}/rest/v1/quiz_eventos`, {method:"POST", keepalive:true,
      headers:{"Content-Type":"application/json", "apikey":SUPABASE.key, "Prefer":"return=minimal"},
      body:JSON.stringify(body)}).catch(()=>{});
  } catch(e) {}
}
/* resposta dada numa etapa: P1 manda a chave do nicho; P2..P6 mandam o texto da opção (até 120); o resto não tem resposta */
function respostaDe(id){
  if (!id || answers[id] == null) return "";
  if (id === "nicho") return nicheKey();
  if (!["dor","gasto","horas","ia","tempo"].includes(id)) return "";
  const o = pick(id); return o && o.t ? String(o.t).slice(0,120) : "";
}
function trackStep(etapa){
  if (!ETAPAS_OK.includes(etapa) || etapa === lastEtapa) return;
  const now = performance.now(), row = {evento:"etapa", etapa, anterior:lastEtapa};
  if (lastEtapa) row.ms = Math.max(0, Math.min(86400000, Math.round(now - lastEtapaT)));   // tempo na etapa anterior
  const resp = respostaDe(lastEtapa); if (resp) row.resposta = resp;                        // o que respondeu na etapa anterior
  lastEtapa = etapa; lastEtapaT = now;
  sendEvent(row);
}

/* ---------- navegação (só pra frente) ---------- */
function updateChrome(){
  const inFlow = step >= 0 && step < RES_STEP;
  prog.hidden = !inFlow;
  // capa: "100% GRATUITO" (o quiz é grátis); sem faixa nas perguntas nem no resultado
  document.getElementById("topbarFree").hidden = step >= 0;
  const pct = inFlow ? Math.round((step+1)/STEPS.length*100) : step < 0 ? 0 : 100;
  document.getElementById("tfill").style.width = Math.max(4,pct) + "%";
  track.setAttribute("aria-valuenow", pct);
}
function runCleanups(){ cleanups.forEach(f=>{ try{ f && f(); }catch(e){} }); cleanups = []; }
function go(n){
  runCleanups();
  delete app.dataset.busy;
  step = n; updateChrome();
  if (step < 0) renderCover();
  else if (step < STEPS.length){ const q = STEPS[step]; q.pause ? renderPause() : q.capture ? renderCapture() : q.loading ? renderLoading() : renderQuestion(); }
  else renderResult();
  trackStep(step < 0 ? "capa" : step < STEPS.length ? STEPS[step].id : "resultado");
  window.scrollTo(0,0);
  const h = app.querySelector("#qt");
  if (h && step >= 0){ h.setAttribute("tabindex","-1"); h.focus({preventScroll:true}); }
}
// clique no botão de compra: registra o evento (keepalive, não se perde ao abrir o checkout);
// enquanto o CHECKOUT for "#", o botão não pula pro topo
document.addEventListener("click", e=>{
  const a = e.target.closest("a.buy"); if (!a) return;
  sendEvent({evento:"cta", botao:(a.dataset.botao || "outro").slice(0,30)});
  if (a.getAttribute("href") === "#") e.preventDefault();
});

go(-1);
document.fonts && document.fonts.ready.then(()=>{ if (step < 0) fitCover(); });
