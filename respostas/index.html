<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel do quiz · Biblioteca de Skills</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://ritjeqziygxnywznwhsc.supabase.co; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Arial,Helvetica,sans-serif' font-weight='800' font-size='36' fill='%23D6A329'%3EA.%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#000;--card:#111113;--card-2:#17171A;--card-3:#202024;
  --line:rgba(255,255,255,.10);--line-2:rgba(255,255,255,.17);
  --text:#ECE9E2;--muted:#A9A498;--dim:#6E6A62;
  --gold:#D6A329;--gold-hi:#F2D488;--gold-soft:rgba(214,163,41,.12);
  --gold-grad:linear-gradient(100deg,#F4DB8F 0%,#D6A329 52%,#B8871A 100%);
  --btn-ink:#1A1406;--err:#FF6B6B;--ok:#4FD18B;
  --f:"Poppins",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text)}
html{overflow-x:clip;-webkit-text-size-adjust:100%}
body{font-family:var(--f);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:clip}
button,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.gold{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.wrap{width:100%;max-width:1100px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left,0px)) 48px max(16px,env(safe-area-inset-right,0px))}

/* topo */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.top h1{margin:0;font-size:24px;line-height:1.15;letter-spacing:-.02em;font-weight:700}
.top h1 .mk{margin-right:6px}
.upd{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--card);font-weight:600;font-size:14px;cursor:pointer}
.btn:hover{border-color:rgba(214,163,41,.6)}
.btn.pri{background:var(--gold-grad);color:var(--btn-ink);border-color:transparent}
.btn:disabled{opacity:.5;cursor:default}

/* filtros */
.filters{display:grid;gap:10px;margin-bottom:18px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.seg button{min-height:40px;border:0;border-radius:10px;background:none;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold-grad);color:var(--btn-ink)}
.sel{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line-2);background:var(--card);padding:0 12px;font-weight:500}
@media (min-width:760px){.filters{grid-template-columns:minmax(0,420px) minmax(0,320px)}}
#dash.busy{opacity:.55;transition:opacity .2s}

/* números do topo */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{min-width:0;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.stat small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat b{display:block;margin-top:4px;font-size:26px;line-height:1.15;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.stat b.sm{font-size:18px;line-height:1.3}
.stat span{display:block;font-size:12px;color:var(--dim);margin-top:2px}
.stat.live{border-color:rgba(79,209,139,.4)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:8px;vertical-align:4px;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,209,139,.6)}70%{box-shadow:0 0 0 9px rgba(79,209,139,0)}100%{box-shadow:0 0 0 0 rgba(79,209,139,0)}}
@media (min-width:760px){.stats{grid-template-columns:repeat(3,1fr)}}

/* blocos */
.grid{display:grid;gap:14px}
@media (min-width:900px){.grid{grid-template-columns:1fr 1fr}.grid .full{grid-column:1/-1}}
.box{min-width:0;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.box h2{margin:0 0 12px;font-size:16px;font-weight:700;letter-spacing:-.01em}
.box h2 small{font-weight:500;color:var(--muted);font-size:12.5px;margin-left:6px}
.sec{margin:26px 0 12px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
.note{margin:0;color:var(--muted);font-size:13.5px}
.note.err{color:var(--err)}

/* barras simples */
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13.5px}
.bar .l{min-width:0;overflow-wrap:anywhere}
.bar .n{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.bar .t{grid-column:1/-1;height:8px;border-radius:4px;background:var(--card-3);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:4px;background:var(--gold-grad)}
.tops{display:grid;gap:8px}
.topi{padding:10px 12px;border-radius:12px;background:var(--card-2);border:1px solid var(--line)}
.topi small{display:block;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.topi b{display:block;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.topi span{font-family:var(--mono);font-size:12px;color:var(--gold-hi)}

/* funil por etapa */
.callout{margin:0 0 12px;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,107,107,.45);background:rgba(255,107,107,.08);color:#ffd6d6;font-size:14px;line-height:1.4}
.callout b{color:#fff}
.ftk{height:10px;border-radius:5px;background:var(--card-3);overflow:hidden}
.ftk i{display:block;height:100%;border-radius:5px;background:var(--gold-grad)}
.fm{display:flex;flex-wrap:wrap;gap:6px}
button.callout{display:block;width:100%;text-align:left;font-family:inherit;cursor:pointer}
button.callout::after{content:" →";color:#ff9b9b}
/* colunas do funil: só a faixa rola pro lado, a página não */
.fstrip{position:relative;display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:2px 0 4px}
.fstrip::-webkit-scrollbar{display:none}
.fcol{flex:0 0 82%;min-width:0;scroll-snap-align:start;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;background:var(--card-2);border:1px solid var(--line)}
@media (min-width:760px){.fcol{flex-basis:280px}}
.fcol.worst{border-color:rgba(255,107,107,.55);background:linear-gradient(180deg,rgba(255,107,107,.10),var(--card-2) 45%)}
.fcol .et{font:500 11px/1 var(--mono);letter-spacing:.08em;color:var(--gold)}
.fcol h3{margin:-4px 0 0;font-size:15.5px;line-height:1.25;font-weight:700;overflow-wrap:anywhere}
.fcol .big{display:flex;align-items:baseline;gap:8px;line-height:1}
.fcol .big b{font-size:34px;font-weight:800;letter-spacing:-.03em}
.fcol .big small{font-size:12.5px;color:var(--muted)}
.fcol .tm{font-size:12.5px;color:var(--muted)}
.fcol .tm b{color:var(--text);font-weight:600}
.fans{margin-top:2px;padding-top:10px;border-top:1px solid var(--line)}
.fans h4{margin:0 0 8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fans .bars{gap:8px}
.fans .bar{font-size:12.5px}
.fans .note{font-size:12.5px}
.fnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.fnav .ind{display:flex;align-items:center;gap:10px;min-width:0;font-size:12.5px;color:var(--muted)}
.fdots{display:flex;gap:4px;flex-wrap:wrap}
.fdots i{width:6px;height:6px;border-radius:3px;background:var(--card-3);transition:all .3s}
.fdots i.on{width:16px;background:var(--gold)}
.fdots i.bad{background:rgba(255,107,107,.6)}
.fdots i.bad.on{background:#ff6b6b}
.farr{display:none;gap:6px}
.farr button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);background:var(--card-2);font-size:20px;line-height:1;cursor:pointer}
.farr button:disabled{opacity:.35;cursor:default}
@media (min-width:760px),(hover:hover) and (pointer:fine){.farr{display:flex}}
.chip{font-size:11.5px;line-height:1.3;padding:3px 8px;border-radius:99px;background:var(--card-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.bad{background:rgba(255,107,107,.14);border-color:rgba(255,107,107,.45);color:#ff9b9b;font-weight:600}
.chip.live{color:var(--ok);border-color:rgba(79,209,139,.45)}

/* minicards dos botões */
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.mini div{min-width:0;padding:10px;border-radius:12px;background:var(--card-2);border:1px solid var(--line)}
.mini b{display:block;font-size:20px;font-weight:800;line-height:1.2}
.mini small{display:block;font-size:11px;color:var(--muted);line-height:1.3}

/* gráfico por dia (só CSS) */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-bottom:10px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.chart{display:flex;align-items:flex-end;gap:4px;height:160px;border-bottom:1px solid var(--line-2)}
.day{flex:1 1 0;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:1px}
.day i{flex:1 1 0;max-width:12px;min-height:2px;border-radius:3px 3px 0 0;background:var(--c)}
.days{display:flex;gap:4px;margin-top:6px}
.days span{flex:1 1 0;min-width:0;text-align:center;font:500 10px/1.2 var(--mono);color:var(--dim);overflow:hidden;white-space:nowrap}
.cV{--c:#6E6A62}.cR{--c:var(--gold)}.cC{--c:var(--ok)}

/* tabela compacta (origem / nicho) */
.tb{display:grid}
.tr{display:grid;grid-template-columns:minmax(0,1fr) 50px 62px 56px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.tr.h{border-top:0;padding-top:0;font-size:10.5px;line-height:1.25;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tr .nm{min-width:0;overflow-wrap:anywhere}
.tr .num{text-align:right;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.tr.h .num{font-family:var(--f);font-size:10.5px;white-space:normal}

/* estados */
.state{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px 0}
.state.in{min-height:0;padding:36px 0}
.state h2{margin:0;font-size:22px;letter-spacing:-.02em}
.state p{margin:0;color:var(--muted);max-width:34ch}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid var(--card-3);border-top-color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mark{font:800 34px/1 var(--f)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="top" hidden>
    <div>
      <h1><span class="mk gold" aria-hidden="true">A.</span>Funil do quiz</h1>
      <p class="upd" id="upd" aria-live="polite"></p>
    </div>
    <div class="acts">
      <button class="btn" id="btnCsv" type="button">Baixar CSV</button>
      <button class="btn pri" id="btnUpd" type="button">Atualizar</button>
    </div>
  </header>

  <div class="filters" id="filters" hidden>
    <div class="seg" role="group" aria-label="Período">
      <button type="button" data-p="hoje" aria-pressed="false">Hoje</button>
      <button type="button" data-p="7" aria-pressed="true">7 dias</button>
      <button type="button" data-p="30" aria-pressed="false">30 dias</button>
      <button type="button" data-p="tudo" aria-pressed="false">Tudo</button>
    </div>
    <select class="sel" id="selNicho" aria-label="Nicho"></select>
  </div>

  <main id="dash" hidden></main>

  <section class="state" id="state" aria-live="polite"></section>
</div>

<script>
/* Painel estratégico do quiz: funil por etapa (quiz_funil_painel) + respostas agregadas (quiz_respostas_painel).
   A chave vem no hash (#k=...), nunca vai pro servidor nem pro Referer.
   Tudo que vem do banco é NÃO CONFIÁVEL: texto só via textContent, números só via N()/I(). */
const BASE = "https://ritjeqziygxnywznwhsc.supabase.co/rest/v1/rpc/";
const APIKEY = "sb_publishable_6xr50iEvbMHEYcyE6F9pEg_xkrTpZkS";
const TZ = "America/Sao_Paulo";
const NICHOS = {   // mesmos rótulos do quiz (NICHES)
  comida:"🍔 Restaurante, lanchonete ou padaria",
  imoveis:"🏠 Corretor ou imobiliária",
  arq:"📐 Arquitetura, engenharia ou obra",
  beleza:"💆‍♀️ Estética, beleza ou saúde",
  criador:"🎥 Criador de conteúdo ou infoprodutor",
  loja:"🛍️ Loja ou e-commerce",
  servicos:"🧰 Prestador de serviço ou MEI",
  foto:"📸 Fotografia e eventos",
  outro:"✨ Outra área / uso pessoal"
};
const ETAPAS = {   // nomes das etapas (iguais aos da função do banco)
  capa:"Entrou no quiz", nicho:"P1 · Nicho", dor:"P2 · Maior trava", gasto:"P3 · Gasto com apps",
  horas:"P4 · Horas por semana", pausa:"Pausa · Prévia", ia:"P5 · Relação com IA", tempo:"P6 · Tempo livre",
  carregando:"Carregando", resultado:"Página de resultado", oferta:"Viu a oferta (após o vídeo)", clique:"Clicou no botão de compra"
};
const BOTOES = {oferta:"Botão da oferta", final:"Botão final (Garantir Agora)"};
const hasOwn = (o,k) => Object.prototype.hasOwnProperty.call(o,k);
const nichoLabel = k => hasOwn(NICHOS,k) ? NICHOS[k] : (k || "Sem nicho");

/* chave: lê do hash, guarda só na memória e limpa a barra de endereço */
let KEY = "";
function readKey(){
  const m = location.hash.match(/(?:^#|&)k=([^&]*)/);
  let k = "";
  if (m){ try { k = decodeURIComponent(m[1]).trim(); } catch(e){ k = ""; } }
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  return k;
}
KEY = readKey();
// link colado numa aba que já está no painel: só o hash muda, sem recarregar
addEventListener("hashchange", () => { const k = readKey(); if (k){ KEY = k; funil = null; rows = []; respLoaded = false; booted = false; load(true); } });

let funil = null, funErr = false, rows = [], respErr = false, respLoaded = false;
let periodo = "7", nichoF = "", booted = false, lastUpd = null, funTok = 0, respTok = 0;
const $ = id => document.getElementById(id);
const top_ = $("top"), filters = $("filters"), dash = $("dash"), state = $("state"), upd = $("upd"), selNicho = $("selNicho");

/* cria elementos só com texto (nunca innerHTML com dado do banco) */
function el(tag, props, ...kids){
  const e = document.createElement(tag);
  if (props) for (const k in props){
    const v = props[k];
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.slice(0,2) === "on") e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) e.append(c instanceof Node ? c : String(c)); });
  return e;
}

/* ---------- normalização (campos não confiáveis) ---------- */
const S = (v, n=200) => v == null ? "" : (typeof v === "object" ? JSON.stringify(v) : String(v)).slice(0, n);
const N = v => { if (v == null || v === "") return null; const x = Number(v); return Number.isFinite(x) && x >= 0 && x < 1e7 ? x : null; };
const I = v => { const x = N(v); return x == null ? 0 : Math.round(x); };                                   // contagem
const MS = v => { if (v == null || v === "") return null; const x = Number(v); return Number.isFinite(x) && x >= 0 && x < 1e11 ? x : null; };
const PC = v => { if (v == null || v === "") return null; const x = Number(v); return Number.isFinite(x) && x >= 0 && x <= 100 ? x : null; };
const obj = v => v && typeof v === "object" && !Array.isArray(v) ? v : {};
const arr = v => Array.isArray(v) ? v.slice(0, 1000) : [];
const entries = o => Object.keys(obj(o)).map(k => [S(k, 40), I(o[k])]);

function norm(r){   // uma resposta (quiz_respostas_painel)
  r = obj(r);
  const a = obj(r.respostas), u = obj(r.utm);
  const d = new Date(r.created_at);
  return {
    d: isNaN(d) ? null : d, nicho: S(r.nicho, 60),
    dor: S(a.dor), gasto: S(a.gasto), horas: S(a.horas), ia: S(a.ia), tempo: S(a.tempo),
    hm: N(r.horas_mes), gm: N(r.gasto_mes),
    src: S(u.utm_source, 80).trim() || "direto",
    utm: {medium:S(u.utm_medium,120), campaign:S(u.utm_campaign,120), content:S(u.utm_content,120), term:S(u.utm_term,120)}
  };
}
function normFunil(d){   // o funil (quiz_funil_painel)
  d = obj(d);
  const seg = r => ({visitas:I(r.visitas), resultado:I(r.resultado), clicaram:I(r.clicaram)});
  return {
    visitas:I(d.visitas), iniciaram:I(d.iniciaram), resultado:I(d.resultado), viram:I(d.viram_oferta),
    clicaram:I(d.clicaram), cliquesTotal:I(d.cliques_total), durMed:MS(d.duracao_mediana_ms),
    porBotao: entries(d.cliques_por_botao).sort((a,b)=>b[1]-a[1]),
    aoVivo: new Map(entries(d.ao_vivo)),
    etapas: arr(d.funil).slice(0,20).map(f => { f = obj(f); const e = S(f.etapa, 20); return {
      etapa:e, nome: hasOwn(ETAPAS,e) ? ETAPAS[e] : (S(f.nome, 60) || e), sessoes:I(f.sessoes),
      pctTopo:PC(f.pct_topo), saida:PC(f.saida_pct), pararam:I(f.pararam_aqui), med:MS(f.mediana_ms),
      respostas: arr(f.respostas).slice(0,12).map(obj).map(r => [S(r.t, 120).trim() || "(vazio)", I(r.n)]).filter(r => r[1] > 0).sort((a,b) => b[1] - a[1])}; }),
    porDia: arr(d.por_dia).map(obj).filter(r => /^\d{4}-\d{2}-\d{2}$/.test(S(r.dia, 10))).map(r => ({dia:S(r.dia,10), ...seg(r)})).sort((a,b)=>a.dia<b.dia?-1:1),
    porOrigem: arr(d.por_origem).map(obj).map(r => ({nome:S(r.origem, 100).trim() || "direto", ...seg(r)})),
    porNicho: arr(d.por_nicho).map(obj).map(r => ({nome:nichoLabel(S(r.nicho, 40)), key:S(r.nicho, 40), ...seg(r)})),
    disp: entries(d.por_dispositivo).sort((a,b)=>b[1]-a[1])
  };
}

/* ---------- formatos ---------- */
const fDay = new Intl.DateTimeFormat("en-CA", {timeZone:TZ, year:"numeric", month:"2-digit", day:"2-digit"});
const fDT = new Intl.DateTimeFormat("pt-BR", {timeZone:TZ, day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit"});
const fHM = new Intl.DateTimeFormat("pt-BR", {timeZone:TZ, hour:"2-digit", minute:"2-digit", second:"2-digit"});
const fmtN = n => Math.round(n).toLocaleString("pt-BR");
const pct = (n, t) => t ? Math.round(n / t * 100) + "%" : "–";
const fmtPc = x => x == null ? "–" : (Math.round(x * 10) / 10).toLocaleString("pt-BR") + "%";
function fmtDur(ms){
  if (ms == null) return "–";
  const s = Math.round(ms / 1000);
  if (s < 60) return s + " s";
  const m = Math.floor(s / 60), r = s % 60;
  if (m < 60) return r ? `${m} min ${r} s` : `${m} min`;
  const h = Math.floor(m / 60), mm = m % 60;
  return mm ? `${h} h ${mm} min` : `${h} h`;
}
const diaCurto = d => d.slice(8,10) + "/" + d.slice(5,7);
const periodoLabel = () => ({hoje:"hoje", "7":"últimos 7 dias", "30":"últimos 30 dias", tudo:"desde o início"}[periodo]);
const diasParam = () => ({hoje:0, "7":7, "30":30, tudo:null}[periodo]);

/* respostas filtradas no navegador (período + nicho) */
function filtered(){
  const now = Date.now(), today = fDay.format(new Date());
  return rows.filter(r => {
    if (nichoF && r.nicho !== nichoF) return false;
    if (periodo === "tudo") return true;
    if (!r.d) return false;
    if (periodo === "hoje") return fDay.format(r.d) === today;
    return now - r.d.getTime() <= (+periodo) * 86400000;
  });
}
function tally(list, f){
  const m = new Map();
  list.forEach(r => { const k = f(r) || "(sem resposta)"; m.set(k, (m.get(k) || 0) + 1); });
  return [...m].sort((a,b) => b[1] - a[1]);
}
const avg = (list, f) => { const v = list.map(f).filter(x => x != null); return v.length ? v.reduce((a,b)=>a+b,0) / v.length : null; };

/* ---------- peças ---------- */
function bars(list, total, max=8, label=x=>x){
  if (list.length > max){
    const rest = list.slice(max-1).reduce((s,e)=>s+e[1],0);
    list = [...list.slice(0,max-1), ["Outras respostas", rest]];
  }
  const top = Math.max(1, ...list.map(e=>e[1]));
  return el("div", {class:"bars"}, list.map(([k,n]) =>
    el("div", {class:"bar"},
      el("span", {class:"l", text:label(k)}),
      el("span", {class:"n", text:`${fmtN(n)} · ${pct(n,total)}`}),
      el("span", {class:"t", "aria-hidden":"true"}, el("i", {style:`width:${Math.max(2, n/top*100)}%`}))
    )));
}
const box = (title, sub, body, full) => el("section", {class:"box" + (full ? " full" : "")}, el("h2", null, title, sub ? el("small", {text:sub}) : null), body);
const stat = (label, value, sub, cls="", bcls="") => el("div", {class:"stat " + cls}, el("small", {text:label}), el("b", {class:bcls}, value), sub ? el("span", {text:sub}) : null);
const emptyIn = (t, p) => el("div", {class:"state in"}, el("h2", {text:t}), p ? el("p", {text:p}) : null);

/* ---------- blocos do funil ---------- */
function blocoCards(F){
  const vivo = [...F.aoVivo.values()].reduce((a,b)=>a+b,0);
  return el("div", {class:"stats"},
    stat("Visitas", fmtN(F.visitas), periodoLabel()),
    stat("Iniciaram o quiz", fmtN(F.iniciaram), `${pct(F.iniciaram, F.visitas)} das visitas`),
    stat("Chegaram ao resultado", fmtN(F.resultado), `${pct(F.resultado, F.visitas)} das visitas (conclusão)`),
    stat("Clicaram no botão", fmtN(F.clicaram), `${pct(F.clicaram, F.visitas)} das visitas · ${pct(F.clicaram, F.viram)} de quem viu a oferta`),
    stat("Tempo mediano no quiz", fmtDur(F.durMed), "da entrada até a última etapa", "", "sm"),
    stat("Agora no quiz", [el("i", {class:"dot", "aria-hidden":"true"}), fmtN(vivo)], "ativos nos últimos 5 minutos", "live")
  );
}
const COM_RESPOSTA = ["nicho","dor","gasto","horas","ia","tempo"];
const SEM_RESPOSTA = {   // o que acontece nas etapas que não têm pergunta
  capa:"Abriu a capa do quiz", pausa:"Prévia com as contas da pessoa", carregando:"Tela de carregamento (~3 s)",
  resultado:"Página de vendas com o vídeo", oferta:"Quem ficou ~30 s no resultado", clique:"Clicou em comprar"
};
function colunaFunil(F, e, i, total, worst){
  const vivo = F.aoVivo.get(e.etapa) || 0, w = e.pctTopo == null ? 0 : e.pctTopo;
  let ans;
  if (COM_RESPOSTA.includes(e.etapa)){
    const tot = e.respostas.reduce((a,r)=>a+r[1],0);
    ans = e.respostas.length ? bars(e.respostas, tot, 12, e.etapa === "nicho" ? nichoLabel : x=>x)
                             : el("p", {class:"note", text:"Ainda sem respostas registradas nessa etapa."});
  } else ans = el("p", {class:"note", text:hasOwn(SEM_RESPOSTA, e.etapa) ? SEM_RESPOSTA[e.etapa] : "—"});
  return el("article", {class:"fcol" + (i === worst ? " worst" : ""), "data-i":String(i), "aria-label":`Etapa ${i+1} de ${total}: ${e.nome}`},
    el("span", {class:"et", text:`ETAPA ${i+1}`}),
    el("h3", {text:e.nome}),
    el("div", {class:"big"}, el("b", {text:fmtN(e.sessoes)}), el("small", {text:`pessoas · ${fmtPc(e.pctTopo)} do topo`})),
    el("div", {class:"ftk", "aria-hidden":"true"}, el("i", {style:`width:${Math.max(e.sessoes ? 1.5 : 0, w)}%`})),
    el("div", {class:"fm"},
      i ? el("span", {class:"chip" + (e.saida != null && e.saida > 30 ? " bad" : ""), text:e.saida == null ? "saída –" : `${fmtPc(e.saida)} saíram aqui`}) : null,
      e.etapa !== "clique" ? el("span", {class:"chip", text:`pararam aqui: ${fmtN(e.pararam)}`}) : null,
      vivo > 0 ? el("span", {class:"chip live", text:`● ${fmtN(vivo)} agora`}) : null),
    e.etapa !== "clique" ? el("p", {class:"tm", style:"margin:0"}, "Tempo mediano na etapa: ", el("b", {text:fmtDur(e.med)})) : null,
    el("div", {class:"fans"}, el("h4", {text:"O que responderam"}), ans)
  );
}
function blocoFunil(F){
  const et = F.etapas;
  if (!et.length) return box("Funil por etapa", null, el("p", {class:"note", text:"Sem dados do funil."}), true);
  let worst = -1;
  // maior saída entre as etapas do quiz; o clique (compra) fica de fora, senão ele sempre "ganharia"
  et.forEach((e,i) => { if (i && e.etapa !== "clique" && e.saida != null && et[i-1].sessoes > 0 && (worst < 0 || e.saida > et[worst].saida)) worst = i; });
  if (worst >= 0 && !(et[worst].saida > 0)) worst = -1;

  const strip = el("div", {class:"fstrip", tabindex:"0", role:"region", "aria-label":"Etapas do funil, deslize para o lado"},
    et.map((e,i) => colunaFunil(F, e, i, et.length, worst)));
  const cols = () => [...strip.children];
  const ind = el("span", {"aria-live":"polite", text:`Etapa 1 de ${et.length}`});
  const dots = el("span", {class:"fdots", "aria-hidden":"true"}, et.map((e,i) => el("i", {class: (i === worst ? "bad" : "") + (i ? "" : " on")})));
  const prev = el("button", {type:"button", "aria-label":"Etapa anterior", text:"‹"});
  const next = el("button", {type:"button", "aria-label":"Próxima etapa", text:"›"});
  let cur = 0;
  const atual = () => {   // coluna mais perto do começo da faixa
    const x = strip.scrollLeft; let best = 0, d = Infinity;
    cols().forEach((c,i) => { const dd = Math.abs(c.offsetLeft - x); if (dd < d){ d = dd; best = i; } });
    if (strip.scrollLeft + strip.clientWidth >= strip.scrollWidth - 2) best = Math.max(best, cols().length - 1 - Math.max(0, Math.floor(strip.clientWidth / Math.max(1, cols()[0].offsetWidth)) - 1));
    return best;
  };
  const paint = () => {
    cur = atual();
    ind.textContent = `Etapa ${cur + 1} de ${et.length}`;
    [...dots.children].forEach((d,i) => d.classList.toggle("on", i === cur));
    prev.disabled = strip.scrollLeft <= 2;
    next.disabled = strip.scrollLeft + strip.clientWidth >= strip.scrollWidth - 2;
  };
  const irPara = (i, foco) => {
    const c = cols()[Math.max(0, Math.min(cols().length - 1, i))]; if (!c) return;
    // primeiro a página (sem animação), depois a faixa: duas rolagens suaves ao mesmo tempo se cancelam
    if (foco) strip.scrollIntoView({block:"nearest"});
    strip.scrollTo({left:c.offsetLeft, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
  };
  prev.addEventListener("click", () => irPara(cur - 1));
  next.addEventListener("click", () => irPara(cur + 1));
  let raf = 0; strip.addEventListener("scroll", () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(paint); }, {passive:true});
  setTimeout(paint, 0);   // depois que a faixa entra na página

  const body = [];
  if (worst >= 0) body.push(el("button", {type:"button", class:"callout", onclick:() => irPara(worst, true)},
    "Maior saída: ", el("b", {text:et[worst].nome}), ` — ${fmtPc(et[worst].saida)} saíram aqui`));
  body.push(strip, el("div", {class:"fnav"}, el("div", {class:"ind"}, ind, dots), el("div", {class:"farr"}, prev, next)));
  return box("Funil por etapa", "deslize para o lado · % do topo e saída em relação à etapa anterior", body, true);
}
function blocoBotoes(F){
  return box("Botões de compra", null, [
    el("div", {class:"mini"},
      el("div", null, el("b", {text:fmtN(F.cliquesTotal)}), el("small", {text:"cliques no total"})),
      el("div", null, el("b", {text:fmtN(F.clicaram)}), el("small", {text:"pessoas clicaram"})),
      el("div", null, el("b", {text:pct(F.clicaram, F.viram)}), el("small", {text:"viu a oferta → clicou"}))),
    F.porBotao.length ? bars(F.porBotao, F.cliquesTotal, 6, k => hasOwn(BOTOES,k) ? BOTOES[k] : k) : el("p", {class:"note", text:"Nenhum clique ainda."})
  ]);
}
function blocoDias(F){
  const dias = F.porDia.slice(-14);
  if (!dias.length) return box("Por dia", null, el("p", {class:"note", text:"Sem visitas nesse período."}));
  const top = Math.max(1, ...dias.map(d => Math.max(d.visitas, d.resultado, d.clicaram)));
  const h = v => `height:${v ? Math.max(2, v / top * 100) : 0}%`;
  return box("Por dia", F.porDia.length > 14 ? "últimos 14 dias" : null, [
    el("div", {class:"legend"}, el("span", {class:"cV", text:"Visitas"}), el("span", {class:"cR", text:"Resultado"}), el("span", {class:"cC", text:"Clicaram"})),
    el("div", {class:"chart"}, dias.map(d => el("div", {class:"day", role:"img",
        "aria-label":`${diaCurto(d.dia)}: ${d.visitas} visitas, ${d.resultado} no resultado, ${d.clicaram} cliques`,
        title:`${diaCurto(d.dia)} · ${d.visitas} visitas · ${d.resultado} resultado · ${d.clicaram} cliques`},
      el("i", {class:"cV", style:h(d.visitas)}), el("i", {class:"cR", style:h(d.resultado)}), el("i", {class:"cC", style:h(d.clicaram)})))),
    el("div", {class:"days", "aria-hidden":"true"}, dias.map((d,i) => el("span", {text: dias.length <= 7 ? diaCurto(d.dia) : (i % 2 === dias.length % 2 ? "" : d.dia.slice(8,10))})))
  ]);
}
function tabela(title, sub, list){
  if (!list.length) return box(title, sub, el("p", {class:"note", text:"Sem dados nesse período."}));
  return box(title, sub, el("div", {class:"tb"},
    el("div", {class:"tr h"}, el("span", {text:"Nome"}), el("span", {class:"num", text:"Visitas"}), el("span", {class:"num", text:"Concluiu"}), el("span", {class:"num", text:"Clicou"})),
    list.slice(0,20).map(r => el("div", {class:"tr"},
      el("span", {class:"nm", text:r.nome}), el("span", {class:"num", text:fmtN(r.visitas)}),
      el("span", {class:"num", text:pct(r.resultado, r.visitas)}), el("span", {class:"num", text:pct(r.clicaram, r.visitas)})))
  ));
}
function blocoDisp(F){
  const tot = F.disp.reduce((s,e)=>s+e[1],0);
  const nome = k => ({celular:"📱 Celular", computador:"💻 Computador"})[k] || "Não informado";
  return box("Dispositivo", null, tot ? bars(F.disp, tot, 4, nome) : el("p", {class:"note", text:"Sem dados nesse período."}));
}

/* ---------- respostas agregadas ---------- */
function blocoRespostas(){
  if (respErr && !respLoaded) return [el("p", {class:"note err", text:"Não deu pra carregar as respostas agora. Toque em Atualizar."})];
  const list = filtered(), t = list.length;
  if (!t) return [el("p", {class:"note", text:"Nenhuma resposta nesse período."})];
  const hm = avg(list, r=>r.hm), gm = avg(list, r=>r.gm), porNicho = tally(list, r=>r.nicho);
  const g = el("div", {class:"grid"});
  g.append(box("Resumo", null, el("div", {class:"mini"},
    el("div", null, el("b", {text:fmtN(t)}), el("small", {text:"respostas"})),
    el("div", null, el("b", {text:hm == null ? "–" : fmtN(hm) + " h"}), el("small", {text:"horas/mês (média)"})),
    el("div", null, el("b", {text:gm == null ? "–" : "R$ " + fmtN(gm)}), el("small", {text:"gasto/mês (média)"})))));
  // IA, tempo livre e o ranking de trava já aparecem nas colunas do funil quando há respostas lá;
  // aqui só entram enquanto a coluna correspondente ainda está vazia (dados antigos, antes do rastreio de respostas)
  const naColuna = id => !!(funil && funil.etapas.some(e => e.etapa === id && e.respostas.length));
  if (nichoF){ if (!naColuna("dor")) g.append(box("Maior trava", "ranking", bars(tally(list, r=>r.dor), t))); }
  else g.append(box("Maior trava por nicho", "a mais escolhida", el("div", {class:"tops"}, porNicho.map(([k,n]) => {
    const d = tally(list.filter(r=>r.nicho===k), r=>r.dor)[0];
    return el("div", {class:"topi"}, el("small", {text:nichoLabel(k)}), el("b", {text:d[0]}), el("span", {text:`${fmtN(d[1])} de ${fmtN(n)}`}));
  }))));
  if (!naColuna("ia")) g.append(box("Relação com IA", null, bars(tally(list, r=>r.ia), t)));
  if (!naColuna("tempo")) g.append(box("O que faria com o tempo livre", null, bars(tally(list, r=>r.tempo), t)));
  return [g];
}

/* ---------- tela ---------- */
function render(){
  showDash();
  upd.textContent = lastUpd ? "Atualizado às " + fHM.format(lastUpd) : "";
  fillNichos();
  $("btnCsv").disabled = !filtered().length;
  dash.replaceChildren();
  const F = funil;
  if (funErr || !F) dash.append(el("p", {class:"note err", text:"Não deu pra carregar o funil agora. Toque em Atualizar."}));
  else if (!F.visitas) dash.append(emptyIn("Ainda sem visitas nesse período", "Quando alguém abrir o quiz, o funil aparece aqui."));
  else {
    dash.append(blocoCards(F));
    const g = el("div", {class:"grid"});
    g.append(blocoFunil(F), blocoBotoes(F), blocoDias(F),
      tabela("Origem", "utm_source", F.porOrigem), tabela("Nicho", null, F.porNicho), blocoDisp(F));
    dash.append(g);
  }
  dash.append(el("h2", {class:"sec", text:"O que as pessoas responderam"}), ...blocoRespostas());
}
function fillNichos(){
  const keys = [...new Set([...Object.keys(NICHOS), ...rows.map(r=>r.nicho), ...(funil ? funil.porNicho.map(r=>r.key) : [])].filter(Boolean))];
  selNicho.replaceChildren(el("option", {value:"", text:"Todos os nichos"}), ...keys.map(k => el("option", {value:k, text:nichoLabel(k)})));
  selNicho.value = keys.includes(nichoF) ? nichoF : "";
}

/* ---------- CSV (respostas filtradas; ; + BOM, protegido contra fórmula) ---------- */
function csvCell(v){
  let s = v == null ? "" : String(v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return '"' + s.replace(/"/g, '""') + '"';
}
function downloadCsv(){
  const list = filtered(); if (!list.length) return;
  const head = ["data_hora","nicho","trava","gasto","horas","ia","tempo_livre","horas_mes","gasto_mes","utm_source","utm_medium","utm_campaign","utm_content","utm_term"];
  const lines = [head.map(csvCell).join(";")].concat(list.map(r => [
    r.d ? fDT.format(r.d) : "", nichoLabel(r.nicho), r.dor, r.gasto, r.horas, r.ia, r.tempo,
    r.hm == null ? "" : String(r.hm).replace(".", ","), r.gm == null ? "" : String(r.gm).replace(".", ","),
    r.src, r.utm.medium, r.utm.campaign, r.utm.content, r.utm.term
  ].map(csvCell).join(";")));
  const blob = new Blob(["﻿" + lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = el("a", {href:URL.createObjectURL(blob), download:`quiz-respostas-${fDay.format(new Date())}.csv`});
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------- estados ---------- */
function showDash(){ top_.hidden = false; filters.hidden = false; dash.hidden = false; state.hidden = true; }
function showState(kind){
  dash.hidden = true; state.hidden = false;
  top_.hidden = kind !== "error"; filters.hidden = true;
  if (kind === "loading") state.replaceChildren(el("div", {class:"spin", "aria-hidden":"true"}), el("p", {text:"Carregando o painel…"}));
  if (kind === "invalid") state.replaceChildren(el("span", {class:"mark gold", "aria-hidden":"true", text:"A."}), el("h2", {text:"Link inválido ou expirado"}), el("p", {text:"Peça o link do painel de novo pra quem cuida do quiz."}));
  if (kind === "error") state.replaceChildren(el("h2", {text:"Não deu pra carregar"}), el("p", {text:"Verifique a internet e tente de novo."}), el("button", {class:"btn pri", type:"button", text:"Tentar de novo", onclick:()=>load(true)}));
}

/* ---------- dados ---------- */
async function rpc(name, body){
  const res = await fetch(BASE + name, {method:"POST", cache:"no-store", credentials:"omit", referrerPolicy:"no-referrer",
    headers:{"apikey":APIKEY, "Content-Type":"application/json"}, body:JSON.stringify(body)});
  let data = null; try { data = await res.json(); } catch(e) {}
  if (res.status === 401 || res.status === 403 || (data && !Array.isArray(data) && data.message === "chave inválida")){
    const e = new Error("chave"); e.invalid = true; throw e;
  }
  if (!res.ok) throw new Error("http " + res.status);
  return data;
}
/* all=true: funil + respostas (Atualizar); all=false: só o funil (trocou período ou nicho) */
async function load(all=true){
  if (!KEY){ showState("invalid"); return; }
  const k = KEY, ft = ++funTok, rt = all ? ++respTok : 0;
  if (!booted) showState("loading"); else { upd.textContent = "Atualizando…"; dash.classList.add("busy"); }
  $("btnUpd").disabled = true;
  const pf = rpc("quiz_funil_painel", {p_chave:k, p_dias:diasParam(), p_nicho:nichoF || null})
    .then(d => { if (!d || typeof d !== "object" || Array.isArray(d)) throw new Error("formato"); return normFunil(d); });
  const pr = all ? rpc("quiz_respostas_painel", {p_chave:k})
    .then(d => { if (!Array.isArray(d)) throw new Error("formato"); return d.map(norm); }) : Promise.resolve(null);
  const [f, r] = await Promise.allSettled([pf, pr]);
  if (k !== KEY) return;   // chegou outra chave no meio do caminho
  if ([f, r].some(x => x.status === "rejected" && x.reason && x.reason.invalid)){
    KEY = ""; funil = null; rows = []; respLoaded = false; booted = false; showState("invalid"); return;
  }
  if (all && rt === respTok){
    if (r.status === "fulfilled"){ rows = r.value; respErr = false; respLoaded = true; } else respErr = true;
  }
  if (ft !== funTok) return;   // tem um pedido do funil mais novo a caminho
  if (f.status === "fulfilled"){ funil = f.value; funErr = false; } else { funil = null; funErr = true; }
  $("btnUpd").disabled = false; dash.classList.remove("busy");
  if (!funil && !respLoaded){ booted = false; showState("error"); return; }
  booted = true; lastUpd = new Date(); render();
}

/* ---------- eventos ---------- */
$("btnUpd").addEventListener("click", () => load(true));
$("btnCsv").addEventListener("click", downloadCsv);
filters.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", () => {
  periodo = b.dataset.p;
  filters.querySelectorAll("[data-p]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  load(false);
}));
selNicho.addEventListener("change", () => { nichoF = selNicho.value; load(false); });
load(true);
</script>
